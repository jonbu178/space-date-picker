        .landing-pad {

            margin: 50px auto;
            border-radius: 10px;
        }
        .hazard-stripe {
            width: 100%;
            height: 10px;
            background: linear-gradient(to right, red 50%, transparent 50%);
            position: absolute;
            top: 0;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
